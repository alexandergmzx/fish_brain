[project]
name = "fish_brain"
version = "0.1.0"
description = "Conversational Big Mouth Billy Bass: push-to-talk -> speech-to-text -> LLM -> text-to-speech -> animated fish"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "pynput>=1.7",
    "faster-whisper>=1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Arduino UNO Q: remote-button push-to-talk and the router RPC (port release, Bridge transport).
unoq = ["evdev>=1.9", "msgpack>=1.0"]
dev = ["pytest>=8", "msgpack>=1.0"]

[project.scripts]
fish-brain = "fish_brain.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fish_brain"]
