[project]
name = "fish_brain"
version = "0.1.0"
description = "Conversational Big Mouth Billy Bass: push-to-talk -> speech-to-text -> LLM -> text-to-speech -> animated fish"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "pynput>=1.7",
    "faster-whisper>=1.0",
    # faster-whisper 1.2.1 opens audio with an option PyAV 18+ no longer has.
    "av<18",
    # 3.x changed the HTTP layer and is untested here.
    "openai>=2.41,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Arduino UNO Q: remote-button push-to-talk, the router RPC (port release, Bridge transport)
# and the Canary speech-to-text backend (1.13.8 is the version measured).
unoq = ["evdev>=1.9", "msgpack>=1.0", "sherpa-onnx>=1.13.8,<2"]
dev = ["pytest>=8", "msgpack>=1.0"]

[project.scripts]
fish-brain = "fish_brain.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fish_brain"]
