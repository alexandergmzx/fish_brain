# Installed by deploy/unoq_setup.sh service to ~/.config/wireplumber/wireplumber.conf.d/.
# The board's onboard codec has no jack (its pins are on the bottom connector): when the USB
# speaker goes away, PipeWire would move the hat's voice there and play into silence, and a
# missing USB microphone would fall back to its silent headset input. Disabled, so a phrase
# always goes to a speaker that is really there, or to the next speaker route (ADR 0016).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = { update-props = { node.disabled = true } }
  }
]
