# Installed by hand to /etc/NetworkManager/conf.d/90-fish-wlan0-own-mac.conf (see deploy/README.md).
# Wi-Fi scans keep wlan0's own MAC. Without this, NetworkManager scans with a random MAC
# (ath10k_snoc is not in the stock exemption list) and Loquendo, started in that window,
# speaks its licence warning (docs/results/2026-10-25-loquendo-licence.md).
[device-fish-wlan0]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no
