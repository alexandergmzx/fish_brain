# Installed by hand to /etc/systemd/journald.conf.d/90-fish.conf (see deploy/README.md).
# The board's power is always pulled and it has no RTC: keep about 30 boots instead of 4,
# and lose at most 15 s of log at a pull instead of up to 5 min.
[Journal]
Storage=persistent
SystemMaxUse=400M
SystemKeepFree=2G
SyncIntervalSec=15s
