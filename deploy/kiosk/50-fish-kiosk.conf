# Installed by the owner as /etc/lightdm/lightdm.conf.d/50-fish-kiosk.conf (see
# `deploy/unoq_setup.sh kiosk on`). The board logs `arduino` in by itself into the default
# X session, where ~/.xsession starts only the fish page. The X server never blanks.
[Seat:*]
autologin-user=arduino
autologin-user-timeout=0
autologin-session=lightdm-xsession
xserver-command=X -s 0 -dpms
