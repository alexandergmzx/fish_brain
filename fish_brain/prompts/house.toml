reprompt = "¿Mapa, libro, amigo o trofeo?"

[[questions.A3.options]]
id = "mapa"
words = ["mapa", "mapas", "el mapa", "un mapa"]
reaction = "Un mapa: tú no esperas a que llegue la aventura, la vas a buscar."

[[questions.A3.options]]
id = "libro"
words = ["libro", "libros", "el libro", "un libro"]
