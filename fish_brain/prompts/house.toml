# The house act: the scripted visit, everything it says word for word (ADR 0015).
# Edit the words and leave the keys. Each line becomes a rendered clip: after a sync and a restart
# the board renders what changed. Run the tests after an edit.
#
# The cross, by position (the houses live in show_bank.py, so an edit cannot unbalance it):
#   question 1 of a set: first option Gryffindor + Hufflepuff, second Ravenclaw + Slytherin
#   question 2 of a set: first option Gryffindor + Slytherin, second Hufflepuff + Ravenclaw
#   question 3 of a set: Gryffindor, Ravenclaw, Hufflepuff, Slytherin, in that order
#
# An option: id (one lower-case word, it names the clip), label (the phone's button, optional),
# words (what a visitor may say: letters and spaces, no accents; the first is the noun as the
# question says it; 4 to 7 forms; never a word another option of the question has; the options of a
# question start with different sounds), reaction (said when it is heard).

[questions.A1]
prompt = "Te dejaron, y sin aviso. La primera semana, ¿qué buscas: una mesa llena, o una libreta?"
reprompt = "¿Mesa, o libreta?"

[[questions.A1.options]]
id = "mesa"
words = ["mesa", "mesas", "mesa llena", "sobremesa"]
reaction = "Contarás tu desgracia once veces, y a la doce la mesa se pondrá del lado de tu ex."

[[questions.A1.options]]
id = "libreta"
words = ["libreta", "libretas", "cuaderno", "cuadernos"]
reaction = "En la libreta, sus defectos y los tuyos en dos columnas. La tuya saldrá más larga."

[questions.A2]
prompt = "Toda fiesta tiene dos refugios para quien no sabe platicar. ¿Dónde te encuentro: en el micrófono, o en la cocina?"
reprompt = "¿Micrófono, o cocina?"

[[questions.A2.options]]
id = "microfono"
label = "Micrófono"
words = ["microfono", "microfonos", "micro", "micros"]
reaction = "Nadie te dio el micrófono, y nadie se atreverá a quitártelo antes de la tercera canción."

[[questions.A2.options]]
id = "cocina"
words = ["cocina", "cocinas", "cocineta", "cocinetas"]
reaction = "Te escondes en la cocina a lavar lo que nadie te pidió. Sales de ahí sabiendo todos los divorcios de la casa."

[questions.A3]
prompt = "En casa ajena hay una puerta con llave. ¿Qué le das: un empujón, una mirada, un aviso al dueño o un precio?"
reprompt = "¿Empujón, mirada, aviso o precio?"

[[questions.A3.options]]
id = "empujon"
label = "Empujón"
words = ["empujon", "empujones", "empujar", "golpe", "golpes"]
reaction = "Un empujón. Detrás había un perro de tres cabezas, y ahora tiene tu zapato."

[[questions.A3.options]]
id = "mirada"
words = ["mirada", "miradas", "mirar", "ojo", "ojos"]
reaction = "Llevas años mirando por cerraduras ajenas. A la tuya nadie se asoma."

[[questions.A3.options]]
id = "aviso"
words = ["aviso", "avisos", "avisar", "avisarle", "dueno"]
reaction = "Avisas. Cuidas la puerta de quien te debe dinero desde hace tres años, y encima le guardas las llaves."

[[questions.A3.options]]
id = "precio"
words = ["precio", "precios", "cobrar", "tarifa"]
reaction = "Aún no sabes qué hay adentro, y ya le pusiste precio. Lo vas a vender dos veces."

[questions.B1]
prompt = "Te cae un dinero que no esperabas, y no es mucho. ¿Qué armas con él: una taquiza, o un presupuesto?"
reprompt = "¿Taquiza, o presupuesto?"

[[questions.B1.options]]
id = "taquiza"
words = ["taquiza", "taquizas", "tacos", "taco", "comilona"]
reaction = "Setenta personas en tu taquiza, y el lunes ninguna te prestará para el camión."

[[questions.B1.options]]
id = "presupuesto"
words = ["presupuesto", "presupuestos", "ahorro", "ahorros"]
reaction = "Dieciséis hojas de cálculo para cuatro mil pesos. Te sobrarán doce pesos, y vas a abrir otra hoja para ellos."

[questions.B2]
prompt = "En plena junta, alguien presenta tu idea como suya. ¿Con qué contestas: un grito, o un archivo?"
reprompt = "¿Grito, o archivo?"

[[questions.B2.options]]
id = "grito"
words = ["grito", "gritos", "gritar", "gritarle", "voz"]
reaction = "Con un grito ganas la junta, pierdes el trabajo, y lo cuentas diez años como una victoria."

[[questions.B2.options]]
id = "archivo"
words = ["archivo", "archivos", "archivero", "carpeta", "carpetas"]
reaction = "Guardarás ese archivo con fecha y copia. Morirás con razón y sin ascenso."

[questions.B3]
prompt = "Tu ex te escribe de madrugada, llorando. ¿Qué le mandas: un insulto, una pregunta, un consuelo o una factura?"
reprompt = "¿Insulto, pregunta, consuelo o factura?"

[[questions.B3.options]]
id = "insulto"
words = ["insulto", "insultos", "groseria", "groserias", "mentada"]
reaction = "Ese insulto lo tenías redactado desde febrero, y solo te faltaba el pretexto."

[[questions.B3.options]]
id = "pregunta"
words = ["pregunta", "preguntas", "preguntar", "preguntarle"]
reaction = "Una pregunta nomás, dices, y en tres horas ya sabes cómo se llama su nueva pareja y su perro."

[[questions.B3.options]]
id = "consuelo"
words = ["consuelo", "consuelos", "consolar", "apapacho", "apapachos"]
reaction = "Consuelas a quien te dejó en visto medio año. A la semana te pedirá prestado para el anillo de otra persona."

[[questions.B3.options]]
id = "factura"
words = ["factura", "facturas", "cuenta", "cuentas", "cobro"]
reaction = "Una factura, con todo e intereses. Es lo más romántico que has hecho en años."

[questions.C1]
prompt = "Llegas al Gran Comedor y no conoces a nadie. ¿Qué sacas primero: un chisme, o un plano?"
reprompt = "¿Chisme, o plano?"

[[questions.C1.options]]
id = "chisme"
words = ["chisme", "chismes", "chismoso", "chismosa", "mitote"]
reaction = "Con un chisme, a la sopa ya eres de la familia. Al postre, el chisme eres tú."

[[questions.C1.options]]
id = "plano"
words = ["plano", "planos", "mapa", "mapas"]
reaction = "Ya ubicaste las tres salidas en tu plano. Así entras a todas partes, con la chamarra puesta y un pie afuera."

[questions.C2]
prompt = "En toda foto de grupo hay dos lugares. ¿Dónde te paras: en el centro, o en la orilla?"
reprompt = "¿Centro, o orilla?"

[[questions.C2.options]]
id = "centro"
words = ["centro", "centros", "medio", "enmedio"]
reaction = "El centro, otra vez. Tienes un álbum entero de gente cortada para que quepas tú."

[[questions.C2.options]]
id = "orilla"
words = ["orilla", "orillas", "esquina", "esquinas"]
reaction = "En la orilla te cortan medio cuerpo desde la primaria. Tu mamá te reconoce en las fotos por el codo."

[questions.C3]
prompt = "Te prestan la capa de invisibilidad un día. ¿Dónde te metes: en una pelea, un sótano ajeno, tu casa o un banco?"
reprompt = "¿Pelea, sótano, casa o banco?"

[[questions.C3.options]]
id = "pelea"
words = ["pelea", "peleas", "pleito", "pleitos"]
reaction = "Eres invisible, y aun así te llevas el primer golpe. Eso ya no es valor, es talento."

[[questions.C3.options]]
id = "sotano"
label = "Sótano"
words = ["sotano", "sotanos", "subterraneo", "sotano ajeno"]
reaction = "Bajas al sótano y encuentras lo que guardan los vecinos. Ya no vas a poder saludarlos."

[[questions.C3.options]]
id = "casa"
words = ["casa", "casas", "hogar", "hogares"]
reaction = "Tu casa. Ahí llevas años sin que nadie te vea, y la capa no cambió nada."

[[questions.C3.options]]
id = "banco"
words = ["banco", "bancos", "boveda", "bovedas"]
reaction = "En el banco ya calculaste cuánto cabe bajo una capa. Nunca pensaste con quién lo ibas a gastar."

