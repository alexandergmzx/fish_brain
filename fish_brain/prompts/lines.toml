# The questions: the prompt, and the narrower re-ask.
[questions.fecha]
prompt = "Empiezo por lo fácil. ¿De qué signo eres?"
reprompt = "Si no lo sabes, dame el día y el mes en que naciste. ¿Cuándo fue?"

[questions.sueno]
prompt = "Tus días ya los leí. ¿Qué fue lo último que soñaste?"
reprompt = "Todos sueñan algo. Aunque sea un pedazo: ¿te perseguían, te caías, se te caían los dientes, volabas, o salía alguien que ya cruzó?"

[questions.deseo]
prompt = "Aquí se pide amor, dinero, salud o venganza. ¿Cuál es tu deseo?"
reprompt = "Algo viniste a pedir. ¿Amor, dinero, salud, venganza, u otra cosa que no se dice en voz alta?"

[questions.consulta]
prompt = "Dímelo en una o dos frases, como te salga. ¿Qué me quieres preguntar?"
reprompt = "No alcancé a oírte bien. Lo que quieras saber, de amor, de trabajo o de lo que traigas: ¿qué me quieres preguntar?"

[questions.consulta_carta]
prompt = "Ahora la carta: si no sacaste una de tu baraja, la saco yo. ¿Cuál te salió?"
reprompt = "Dime el nombre de tu carta, como La Luna o El Mago, o dime que saque yo. ¿Cuál es?"

[questions.carta_tarot]
prompt = "¿Quieres que te lea una carta?"
reprompt = "Contesta sí o no, que la baraja espera. Y si ya sacaste una, ¿cuál te salió?"

[questions.taza]
prompt = "Mira el fondo de tu taza. ¿Qué figura ves?"
reprompt = "Tu taza ya habló. Estrella, corazón, luna, anillo, animal, árbol, ojo, nube, llave o calabaza: ¿a cuál se parece?"

