<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pez Parlante</title>
    <link rel="stylesheet" href="/fish.css">
</head>
<body>
    <div class="container">
        <h1>🐟 Pez Parlante</h1>

        <div class="stage-wrap">
            <canvas id="stage" width="600" height="500"></canvas>
            <div id="conn-dot" title="Conexión"></div>
            <div class="status" id="status" role="status" aria-live="polite">Conectando…</div>
        </div>

        <div class="controls">
            <div class="slider-container">
                <label for="sensitivity">Sensibilidad: <span id="sensitivityValue">2.5</span></label>
                <input type="range" id="sensitivity" min="1" max="5" step="0.1" value="2.5">
            </div>
            <div class="slider-container">
                <label for="smoothing">Suavizado: <span id="smoothingValue">0.8</span></label>
                <input type="range" id="smoothing" min="0" max="0.95" step="0.05" value="0.8">
            </div>
            <div class="toggles">
                <label><input type="checkbox" id="toggleBubbles" checked> Burbujas</label>
                <label><input type="checkbox" id="toggleAudio"> Sonido en navegador</label>
            </div>
            <div class="file-row">
                <label for="audioFile">Probar con un WAV…</label>
                <input type="file" id="audioFile" accept=".wav,audio/wav">
            </div>
        </div>
    </div>
    <script src="/fish.js"></script>
</body>
</html>
