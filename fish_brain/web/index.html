<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1b1a3a">
    <title>El Sombrero Adivino</title>
    <link rel="icon" href="data:,">
    <!-- The study's night before anything else arrives, and the view's classes before first
         paint (the same rule as fish.js, which loads at the end of the body). -->
    <style>html { background: #1b1a3a; }</style>
    <script>
        (function () {
            var p = new URLSearchParams(location.search), c = document.documentElement.classList;
            var con = p.get("kiosk") !== "1" && p.get("debug") !== "1";
            if (con || p.get("kiosk") === "1") c.add("kiosk");
            if (con) c.add("console");
        })();
    </script>
    <link rel="stylesheet" href="/fish.css">
</head>
<body>
    <!-- The study: a window with the moon, a floor of boards, books and a candle. Original
         shapes, drawn here. Decoration only. -->
    <div class="scene" aria-hidden="true">
        <svg class="ventana" viewBox="0 0 100 132">
            <path d="M8,130 V52 A42,42 0 0 1 92,52 V130 Z" fill="#3a3352" stroke="#23231c" stroke-width="4" stroke-linejoin="round"/>
            <path d="M19,124 V54 A31,31 0 0 1 81,54 V124 Z" fill="#141236"/>
            <g id="stars" fill="#f3ecc8">
                <circle cx="30" cy="62" r="1.6"/><circle cx="42" cy="98" r="1.3"/><circle cx="70" cy="104" r="1.7"/>
                <circle cx="35" cy="114" r="1.1"/><circle cx="60" cy="76" r="1.2"/><circle cx="28" cy="84" r="1"/>
            </g>
            <path d="M64,34 A13,13 0 1 0 72,58 A10,10 0 1 1 64,34 Z" fill="#f3ecc8"/>
            <path d="M50,26 V124 M19,86 H81" stroke="#23231c" stroke-width="4" stroke-linecap="round"/>
            <path d="M4,130 H96" stroke="#23231c" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <svg class="piso" viewBox="0 0 360 120" preserveAspectRatio="none">
            <path d="M-4,18 H364 V124 H-4Z" fill="#4d3119" stroke="#23231c" stroke-width="4" vector-effect="non-scaling-stroke"/>
            <g stroke="#2e1708" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0.7">
                <path d="M-4,52 H364 M-4,88 H364"/>
                <path d="M70,18 V52 M190,18 V52 M300,18 V52 M30,52 V88 M140,52 V88 M250,52 V88 M100,88 V124 M220,88 V124 M330,88 V124"/>
            </g>
        </svg>
        <svg class="prop libros" viewBox="0 0 90 70">
            <g stroke="#23231c" stroke-width="3" stroke-linejoin="round">
                <rect x="6" y="46" width="78" height="18" rx="2" fill="#6b2a36"/>
                <rect x="12" y="28" width="66" height="18" rx="2" fill="#2f4d6b" transform="rotate(-3 45 37)"/>
                <rect x="4" y="11" width="72" height="17" rx="2" fill="#5b6b2a" transform="rotate(4 40 19)"/>
            </g>
            <g stroke="#d2ad75" stroke-width="2" stroke-linecap="round">
                <path d="M14,51 V59 M76,51 V59"/><path d="M20,33 V41 M70,31 V39"/><path d="M12,16 V23 M68,20 V27"/>
            </g>
        </svg>
        <svg class="prop vela" viewBox="0 0 60 120">
            <ellipse class="halo" cx="30" cy="34" rx="26" ry="30" fill="#ffcf7a" opacity="0.25"/>
            <g class="llama"><path d="M30,18 C38,30 38,42 30,46 C22,42 22,30 30,18 Z" fill="#ffb22e" stroke="#23231c" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M30,30 C33,36 33,41 30,43 C27,41 27,36 30,30 Z" fill="#fff3c4"/></g>
            <path d="M30,46 V52" stroke="#23231c" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M18,52 H42 V106 H18 Z M18,52 C18,64 22,66 22,58 M42,52 C42,70 37,72 37,60" fill="#f7e7c4" stroke="#23231c" stroke-width="3" stroke-linejoin="round"/>
            <ellipse cx="30" cy="108" rx="26" ry="8" fill="#b88a3a" stroke="#23231c" stroke-width="3"/>
        </svg>
    </div>

    <div class="container">
        <h1><span>El Sombrero Adivino</span></h1>

        <div class="stage-wrap">
            <!-- The stool the hat sits on, then the hat: .perch breathes all the time, .perch-kick
                 leans in to listen and jolts when it speaks. The drawn hat (svg#hat) shows until
                 the four base sprites load; then the canvas draws the sprites (img/README.md). -->
            <svg class="banco" viewBox="0 0 200 110" aria-hidden="true">
                <g stroke="#23231c" stroke-width="4" stroke-linejoin="round">
                    <path d="M28,20 L16,108 M172,20 L184,108 M100,24 V108" fill="none" stroke="#3b2414" stroke-width="10" stroke-linecap="round"/>
                    <ellipse cx="100" cy="16" rx="96" ry="13" fill="#6e4a2a"/>
                    <path d="M4,16 Q100,40 196,16" fill="none" stroke-width="3"/>
                </g>
            </svg>
            <div class="perch"><div class="perch-kick">
                    <svg id="hat" viewBox="0 0 600 500" aria-hidden="true">
                        <defs>
                            <linearGradient id="g-cuero" x1="0" y1="0" x2="1" y2="0.2">
                                <stop offset="0" stop-color="#4f2c13"/><stop offset="0.55" stop-color="#8a5630"/><stop offset="1" stop-color="#6a3d1d"/>
                            </linearGradient>
                            <linearGradient id="g-punta" x1="1" y1="1" x2="0" y2="0">
                                <stop offset="0" stop-color="#7d4a26"/><stop offset="1" stop-color="#4a2a12"/>
                            </linearGradient>
                            <linearGradient id="g-ala" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#7a4a28"/><stop offset="1" stop-color="#4a2a12"/>
                            </linearGradient>
                        </defs>
                        <!-- the brim, back part: the crown sits on it -->
                        <path class="brim-part" id="brim" d="M557,412 Q557,415 554,418 Q552,420 553,423 Q554,426 548,428 Q542,430 540,433 Q538,436 532,438 Q526,440 518,442 Q510,444 504,447 Q499,449 489,451 Q478,452 470,454 Q463,457 451,458 Q440,459 430,460 Q419,462 409,463 Q398,465 387,466 Q376,467 363,467 Q349,467 337,467 Q325,468 312,469 Q300,469 287,470 Q274,470 262,470 Q250,470 238,469 Q226,469 213,469 Q199,469 190,467 Q181,465 168,465 Q155,465 146,463 Q138,461 130,460 Q121,458 113,456 Q104,455 96,453 Q88,451 79,450 Q70,448 68,445 Q66,443 59,441 Q53,438 49,436 Q46,433 46,431 Q45,428 44,426 Q42,423 44,418 Q46,414 48,411 Q50,408 52,406 Q55,403 58,401 Q61,398 67,396 Q73,393 80,391 Q86,388 93,386 Q100,384 109,382 Q118,380 127,378 Q137,376 146,374 Q156,372 167,371 Q178,369 190,368 Q202,367 213,366 Q225,364 237,364 Q250,363 262,362 Q274,361 287,361 Q300,361 313,361 Q325,362 338,361 Q351,361 363,363 Q374,364 386,365 Q399,365 410,366 Q422,367 432,369 Q442,370 453,372 Q464,373 472,375 Q480,377 490,379 Q500,381 508,383 Q516,385 522,387 Q528,389 534,392 Q541,394 543,397 Q546,399 550,402 Q554,404 556,407 Q557,410 557,412 Z"
                              fill="url(#g-ala)" stroke="#23231c" stroke-width="3.5" stroke-linejoin="round"/>
                        <!-- the crown: a tall, crooked cone of worn leather -->
                        <g id="crown">
                            <path d="M150,410 C168,338 206,262 246,206 C262,184 278,164 288,150 L344,146 C352,178 368,226 390,282 C410,334 436,378 452,408 Q300,452 150,410 Z"
                                  fill="url(#g-cuero)" stroke="#23231c" stroke-width="3.5" stroke-linejoin="round"/>
                            <!-- creases where the leather has folded for years -->
                            <g fill="none" stroke="#2e1708" stroke-linecap="round" opacity="0.55">
                                <path d="M262,196 C280,206 300,204 322,196" stroke-width="3"/>
                                <path d="M236,228 C266,242 312,240 352,222" stroke-width="3"/>
                                <path d="M190,318 C178,352 176,380 182,404" stroke-width="2.5"/>
                                <path d="M414,318 C420,350 428,378 436,398" stroke-width="2.5"/>
                                <path d="M330,150 C336,170 340,186 352,206" stroke-width="2"/>
                            </g>
                            <!-- a band of darker leather with its stitches -->
                            <path d="M162,384 Q300,424 442,382 L450,404 Q300,446 152,406 Z" fill="#3e2210" stroke="#23231c" stroke-width="3" stroke-linejoin="round"/>
                            <path d="M164,394 Q300,434 444,392" fill="none" stroke="#d2ad75" stroke-width="2.2" stroke-dasharray="7 6" stroke-linecap="round"/>
                            <g id="face">
                                <g id="brows" fill="#4a2a12" stroke="#23231c" stroke-width="3" stroke-linejoin="round">
                                    <path d="M224,262 C238,240 268,234 296,246 C284,252 262,252 240,266 Z"/>
                                    <path d="M312,244 C340,230 372,236 388,258 C370,250 344,250 322,256 Z"/>
                                </g>
                                <g id="eyes">
                                    <path d="M236,284 C252,266 282,266 296,280 C282,276 254,276 236,284 Z" fill="#5d3519" stroke="#23231c" stroke-width="2.5" stroke-linejoin="round"/>
                                    <path d="M240,286 C256,276 280,276 292,282 C278,294 254,296 240,286 Z" fill="#1a0c04"/>
                                    <circle cx="276" cy="284" r="2.6" fill="#f3e2c0"/>
                                    <path d="M318,278 C334,264 364,264 380,280 C364,274 336,274 318,278 Z" fill="#5d3519" stroke="#23231c" stroke-width="2.5" stroke-linejoin="round"/>
                                    <path d="M322,281 C336,274 360,274 376,282 C362,292 336,294 322,281 Z" fill="#1a0c04"/>
                                    <circle cx="356" cy="281" r="2.6" fill="#f3e2c0"/>
                                </g>
                                <path id="lip-upper" d="M206,330 Q300,312 404,328" fill="none" stroke="#2e1708" stroke-width="4" stroke-linecap="round"/>
                                <path id="mouth" d="M214,338 Q302,328 396,336 Q302,346 214,338 Z" fill="#1a0c04" stroke="#23231c" stroke-width="3" stroke-linejoin="round"/>
                                <path id="lip-lower" d="M224,346 Q302,354 386,344" fill="none" stroke="#2e1708" stroke-width="4" stroke-linecap="round"/>
                            </g>
                        </g>
                        <!-- the brim, front part: over the crown's base -->
                        <path class="brim-part" id="brim-front" d="M557,415 Q552,420 553,423 Q554,426 548,428 Q542,430 540,433 Q538,436 532,438 Q526,440 518,442 Q510,444 504,447 Q499,449 489,451 Q478,452 470,454 Q463,457 451,458 Q440,459 430,460 Q419,462 409,463 Q398,465 387,466 Q376,467 363,467 Q349,467 337,467 Q325,468 312,469 Q300,469 287,470 Q274,470 262,470 Q250,470 238,469 Q226,469 213,469 Q199,469 190,467 Q181,465 168,465 Q155,465 146,463 Q138,461 130,460 Q121,458 113,456 Q104,455 96,453 Q88,451 79,450 Q70,448 68,445 Q66,443 59,441 Q53,438 49,436 Q46,433 46,431 Q45,428 44,426 L42,423 L150,410 Q300,452 452,408 Z"
                              fill="#6a3d1d" stroke="#23231c" stroke-width="3.5" stroke-linejoin="round"/>
                        <path class="brim-part" id="brim-fold" d="M84,440 Q300,476 516,438" fill="none" stroke="#2e1708" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
                        <!-- the tip: a floppy end that droops to the left, pivoting where it leaves the crown -->
                        <g id="tip-bend">
                            <g id="tip">
                                <path d="M344,148 C350,96 318,50 266,44 C232,40 204,58 202,84 C200,104 220,112 232,100 C240,92 236,80 248,78 C270,76 286,104 288,152 Z"
                                      fill="url(#g-punta)" stroke="#23231c" stroke-width="3.5" stroke-linejoin="round"/>
                                <path d="M300,108 C306,90 302,74 288,64" fill="none" stroke="#2e1708" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
                            </g>
                        </g>
                    </svg>
                <canvas id="stage" width="600" height="500" hidden></canvas>
            </div></div>
            <div class="status" id="status" role="status" aria-live="polite">Conectando…</div>
        </div>

        <!-- What the hat said and what it heard, as speech bubbles (empty: no bubble). -->
        <div class="say">
            <p class="bubble bubble-reply"><span id="cReply"></span></p>
            <p class="bubble bubble-heard"><span id="cHeard"></span></p>
        </div>

        <!-- The talk target. Three boxes so no motion overrides another: the state's loop on
             .talk-loop, the lean with the voice on .talk-lean, press and nudge on the button. -->
        <div class="talk"><div class="talk-loop"><div class="talk-lean">
            <button id="pttButton" type="button">🎤 Mantén para hablar <small>(o barra espaciadora)</small></button>
        </div></div></div>
        <!-- The phone's microphone (FISH_MIC_CAPTURE=browser): one tap grants it. Hidden until
             /status asks for it; it stays on the main surface because it comes back whenever
             the phone slept. -->
        <button id="micGate" type="button" hidden>🎙️ Activar micrófono</button>

        <!-- The corner: the candle opens the operator's sheet when held; its flame is the
             connection; the mark beside it says "operator, look here". -->
        <div class="corner">
            <button id="consoleGear" type="button" aria-label="Ajustes del operador">
                <svg class="vela-mano" viewBox="0 0 40 44" aria-hidden="true">
                    <path d="M13,8 H27 V36 H13 Z M13,8 C13,16 16,17 16,12 M27,8 C27,18 24,19 24,13" fill="#f7e7c4" stroke="#23231c" stroke-width="2.5" stroke-linejoin="round"/>
                    <ellipse cx="20" cy="37" rx="17" ry="5.5" fill="#b88a3a" stroke="#23231c" stroke-width="2.5"/>
                </svg>
                <span class="llama-mano"><span id="conn-dot" title="Conexión"></span></span>
            </button>
            <span class="warn" aria-hidden="true">!</span>
        </div>

        <div id="sheetScrim"></div>
        <!-- The operator's sheet (shown while html.ops-open): the reading and the status words
             first, then the developer rows. Without ?kiosk or the console this is the plain
             controls block of the ?debug=1 page. -->
        <div class="controls">
            <div class="sheet-head"><strong>Operador</strong><button id="sheetClose" type="button">Cerrar</button></div>
            <div class="c-status" role="status" aria-live="polite">
                <span id="cLink">…</span><span id="cNet"></span><span id="cMic"></span><span id="cListen"></span>
            </div>
            <!-- The reading: a badge photo, or a typed name, becomes "¿Tú eres X?". -->
            <div class="c-read" id="cRead">
                <button id="badgeBtn" type="button">📷 Foto del gafete</button>
                <button id="galleryBtn" type="button">🖼️ Galería</button>
                <label id="lookWrap" hidden><input type="checkbox" id="lookTick"> Describir su look (con permiso)</label>
                <input type="text" id="readName" placeholder="Nombre" autocomplete="off" autocapitalize="words"
                       autocorrect="off" spellcheck="false" enterkeyhint="go">
                <button id="readBtn" type="button">🔮 Leer el futuro</button>
                <span id="readMsg" role="status" aria-live="polite"></span>
                <input type="file" id="badgeCam" accept="image/jpeg,image/*" capture="environment" hidden>
                <input type="file" id="badgeFile" accept="image/jpeg,image/*" hidden>
            </div>
            <div class="slider-container">
                <label for="sensitivity">Sensibilidad: <span id="sensitivityValue">2.5</span></label>
                <input type="range" id="sensitivity" min="1" max="5" step="0.1" value="2.5">
            </div>
            <div class="mic-row">
                <label for="micSelect">Micrófono</label>
                <select id="micSelect"><option value="">Predeterminado</option></select>
                <canvas id="micMeter" width="560" height="40"></canvas>
                <div id="transcript" class="transcript">
                    <p class="t-user"><span class="t-tag">🗣️</span> <span id="tUser">…</span></p>
                    <p class="t-fish"><span class="t-tag">🎩</span> <span id="tFish">…</span></p>
                </div>
            </div>
            <div class="speak-row">
                <label for="speakText">Hacer que el sombrero diga…</label>
                <textarea id="speakText" rows="2" placeholder="Escribe aquí y pulsa Hablar"></textarea>
                <button id="speakBtn" type="button">🗣️ Hablar</button>
            </div>
            <div class="toggles">
                <label class="c-hide"><input type="checkbox" id="toggleAudio"> Sonido en navegador</label>
                <label><input type="checkbox" id="toggleWait"> Esperar para hablar</label>
            </div>
            <div class="file-row">
                <label for="audioFile">Probar con un WAV…</label>
                <input type="file" id="audioFile" accept=".wav,audio/wav">
            </div>
        </div>
    </div>

    <!-- What fish.js puts inside the talk target next to its words (it empties the button
         first): the well with the two voice rings and one small drawing per state. -->
    <template id="talkParts">
        <span class="p-well" aria-hidden="true">
            <span class="p-ring r1"></span><span class="p-ring r2"></span>
            <svg class="p-icon i-remote" viewBox="0 0 24 24"><rect x="7.5" y="2" width="9" height="20" rx="3.5" fill="#fffdf2" stroke="#23231c" stroke-width="2.2"/><circle cx="12" cy="8" r="2.6" fill="#ff6f7d" stroke="#23231c" stroke-width="1.6"/><path d="M10.5 14.5h3M10.5 17.5h3" stroke="#23231c" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="p-icon i-press" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#23231c" stroke-width="2.2"/><circle cx="12" cy="12" r="3.8" fill="#ff6f7d" stroke="#23231c" stroke-width="1.8"/></svg>
            <svg class="p-icon i-waiting" viewBox="0 0 24 24"><g fill="#23231c"><circle cx="5.5" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="18.5" cy="12" r="2.4"/></g></svg>
            <svg class="p-icon i-listening" viewBox="0 0 24 24"><g fill="none" stroke="#23231c" stroke-width="2.3" stroke-linecap="round"><circle cx="5.5" cy="12" r="1.6" fill="#23231c"/><path d="M10 8a5.5 5.5 0 0 1 0 8M14 5a9.5 9.5 0 0 1 0 14M18 2.5a13 13 0 0 1 0 19"/></g></svg>
            <svg class="p-icon i-thinking" viewBox="0 0 24 24"><path d="M12 12.2a1.6 1.6 0 1 1 1.7 1.9a3.6 3.6 0 1 1 2-6.4a6 6 0 1 1-7.6 9.5a8.6 8.6 0 0 1-2.6-9.4" fill="none" stroke="#23231c" stroke-width="2.3" stroke-linecap="round"/></svg>
            <svg class="p-icon i-speaking" viewBox="0 0 24 24"><path d="M3 9.5h4l5.5-4.5v14L7 14.5H3Z" fill="#fffdf2" stroke="#23231c" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 9a4.2 4.2 0 0 1 0 6M19 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="#23231c" stroke-width="2.2" stroke-linecap="round"/></svg>
            <svg class="p-icon i-reading" viewBox="0 0 24 24"><rect x="3" y="4" width="14" height="16" rx="2.5" fill="#fffdf2" stroke="#23231c" stroke-width="2.2"/><path d="M6.5 9h7M6.5 12.5h4.5" stroke="#23231c" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="15" r="4" fill="#eafcff" stroke="#23231c" stroke-width="2.2"/><path d="M19 18l2.6 2.6" stroke="#23231c" stroke-width="2.4" stroke-linecap="round"/></svg>
            <svg class="p-icon i-offline" viewBox="0 0 24 24"><path d="M4 6h7l-7 8h7M14 12h6l-6 7h6" fill="none" stroke="#23231c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
    </template>
    <script src="/fish.js"></script>
</body>
</html>
